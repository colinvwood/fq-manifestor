name: Container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTAINER_IMAGE: ghcr.io/colinvwood/fq-manifestor

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag fq-manifestor:test .

      - name: Verify container CLI and pipeline outputs
        run: |
          docker run --rm --read-only --tmpfs /tmp --user 65534:65534 \
            -i fq-manifestor:test python - <<'PY'
          import gzip
          from pathlib import Path
          import subprocess
          from tempfile import TemporaryDirectory

          subprocess.run(["fq-manifestor", "--help"], check=True)
          with TemporaryDirectory() as directory:
              root = Path(directory)
              (root / "reads").mkdir()
              filenames = [
                  "prefix_sample_alpha_R1_001.fastq.gz",
                  "prefix_sample_alpha_R2_001.fastq.gz",
                  "unknown_R1_001.fastq.gz",
              ]
              for filename in filenames:
                  with gzip.open(root / "reads" / filename, "wt") as stream:
                      stream.write("@read\nACGT\n+\nIIII\n")
              (root / "metadata.tsv").write_text("sample-id\nsample_alpha\n")

              subprocess.run([
                  "fq-manifestor", "reads/", "manifest.tsv",
                  "--use-pwd", "--metadata", "metadata.tsv",
              ], cwd=root, check=True)

              assert (root / "manifest.tsv").read_text().splitlines() == [
                  "sample-id\tforward-absolute-filepath\treverse-absolute-filepath",
                  "sample_alpha\t$PWD/reads/" + filenames[0]
                  + "\t$PWD/reads/" + filenames[1],
              ]
              assert (root / "files-missing-from-md.tsv").read_text().splitlines() == [
                  "absolute-filepath",
                  "$PWD/reads/" + filenames[2],
              ]
          print("Container CLI smoke check passed")
          PY

      - name: Log in to GHCR
        if: >-
          github.repository == 'colinvwood/fq-manifestor' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: >-
          github.repository == 'colinvwood/fq-manifestor' &&
          github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            container_tag="${GITHUB_REF_NAME#v}"
          else
            container_tag=main
          fi
          container_ref="$CONTAINER_IMAGE:$container_tag"
          docker tag fq-manifestor:test "$container_ref"
          docker push "$container_ref"
